# SceneSplat (interior_gs) .npy Gaussian scenes for VQ-VAE fine-tuning.
# Based on vfront_houses.yaml but: data is per-attribute .npy (routed through
# scenesplat_npy loader via the load_gaussians branch), cameras/depth come from
# the finetune_data folder built by prep_cameras.py + prep_depth.py, and depth
# is stored as .npy (not .exr).
defaults:
  - points

dataset_name: vfront   # reuse the vfront datamodule/loader path

# root holding per-scene .npy gaussians (train/<scene>/coord.npy ...)
data_path: /scratch-shared/mkhan4/gaussian_world/preprocessed/interior_gs/train
# cameras + depth prepared alongside; per-scene <scene>/transforms_train.json,
# <scene>/images/, <scene>/depth/
transforms_path: /scratch-shared/mkhan4/gaussian_world/finetune_data
img_path: /scratch-shared/mkhan4/gaussian_world/finetune_data

train_split: data_splits/scenesplat700_train.txt
val_split: data_splits/scenesplat700_val.txt

# scene directory itself is the gaussian "file" (the branch detects coord.npy)
gaussian_subpath: ""

n_images: 12          # frames loaded per scene for the re-rendering loss

max_points: 1000000000
center_sample: false
voxel_size: 0.025

background_color: black

# full room layouts -> train on camera-visible chunks (cubes)
chunk_subsample: true
chunk_shape: [24, 24, 20]
chunk_voxel_size: 0.2
min_chunk_occupancy: 0.2
max_chunk_attempts: 10
chunk_origin: [null, null, 0]
camera_chunk_min_area_ratio: 0.4

depth:
  enabled: true
  subdir: depth
  extension: .npy          # we write depth as .npy (imageio EXR plugin is broken here)
  chunk_mask:
    enabled: true
  camera_sampling:
    enabled: true
    probe_multiplier: 8
    depth_stat_stride: 1